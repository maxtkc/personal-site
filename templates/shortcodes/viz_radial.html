<!-- ════════════════════════════════════════════════════════
     VIZ 4 · RADIAL TIME WHEEL
════════════════════════════════════════════════════════ -->
<section id="radial">
  <div class="inner fadein">
    <div class="sec-header">
      <h2>The Time <span>Wheel</span></h2>
      <p>Each ring is a year (inner = older). Dots placed by day-of-year around the circle. A clock of food rescues.</p>
    </div>
    <div style="display:flex;justify-content:center">
      <div class="viz-box" id="radial-container" style="width:100%"></div>
    </div>
  </div>
</section>

{% raw %}
<script>
(function () {
  function init({ pts }) {
    const box = document.getElementById('radial-container');

    function render() {
      box.innerHTML = '';

      const availW = box.clientWidth || 700;
      const SIZE   = Math.min(availW, 680);
      const CX     = SIZE / 2, CY = SIZE / 2;

      const years  = d3.range(d3.min(pts, d => d.year), d3.max(pts, d => d.year) + 1);
      const rInner = SIZE * 0.09;
      const rOuter = SIZE * 0.40;
      const ringW  = (rOuter - rInner) / years.length;

      // Label radius — extra gap between ring edge and month text
      const labelR = rOuter + SIZE * 0.03;
      const fontSize = Math.max(8, Math.round(SIZE * 0.022));

      const cYear = d3.scaleOrdinal()
        .domain(years)
        .range(['#22c55e','#38bdf8','#a78bfa','#f472b6','#fb923c','#fbbf24','#86efac']);

      // Total SVG height = SIZE; SVG width = SIZE (square, centered via margin:auto)
      const svg = d3.select(box).append('svg')
        .attr('width', SIZE).attr('height', SIZE)
        .style('display', 'block').style('margin', 'auto');

      const g = svg.append('g').attr('transform', `translate(${CX},${CY})`);

      // Year rings
      years.forEach((yr, i) => {
        const r = rInner + i * ringW + ringW / 2;
        g.append('circle').attr('r', r)
          .attr('fill','none').attr('stroke', '#111820').attr('stroke-width', ringW - 1);

        g.append('text')
          .attr('x', 0).attr('y', -(r))
          .attr('text-anchor','middle').attr('dominant-baseline','auto')
          .attr('fill', cYear(yr)).attr('fill-opacity', 0.5)
          .attr('font-size', Math.max(8, Math.round(SIZE * 0.018))).attr('font-weight', 700)
          .text(yr);
      });

      // Month dividers + labels
      const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      MONTHS.forEach((m, mi) => {
        const angle = (mi / 12) * Math.PI * 2 - Math.PI / 2;
        const cos = Math.cos(angle), sin = Math.sin(angle);

        g.append('line')
          .attr('x1', rInner * cos).attr('y1', rInner * sin)
          .attr('x2', rOuter * cos).attr('y2', rOuter * sin)
          .style('stroke', 'var(--fg-muted-4, #8fa8b8)').attr('stroke-width', 0.5);

        g.append('text')
          .attr('x', labelR * cos).attr('y', labelR * sin)
          .attr('text-anchor','middle').attr('dominant-baseline','middle')
          .style('fill', 'var(--fg-muted-4, #8fa8b8)')
          .attr('font-size', fontSize)
          .text(m);
      });

      // Data dots
      const MS_PER_DAY = 86_400_000;
      const doy = d => {
        const jan1 = Date.UTC(d.getUTCFullYear(), 0, 1);
        return Math.floor((d - jan1) / MS_PER_DAY);
      };
      const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;

      const dotR = Math.max(2, SIZE * 0.005);

      pts.forEach(p => {
        const yi = years.indexOf(p.year);
        if (yi < 0) return;
        const days = isLeap(p.year) ? 366 : 365;
        const angle = (doy(p.time) / days) * Math.PI * 2 - Math.PI / 2;
        const r = rInner + yi * ringW + ringW / 2;
        const x = r * Math.cos(angle), y = r * Math.sin(angle);

        g.append('circle')
          .attr('cx', x).attr('cy', y).attr('r', dotR)
          .attr('fill', cYear(p.year))
          .attr('fill-opacity', 0.85)
          .attr('stroke', cYear(p.year)).attr('stroke-opacity', 0.25).attr('stroke-width', dotR * 1.3)
          .on('mouseover', ev => {
            tip(`<strong>${p.name}</strong><br>${p.time.toLocaleDateString()}`, ev);
          })
          .on('mousemove', moveTip)
          .on('mouseout', hideTip);
      });

      // Center count
      const countFontSize = Math.max(16, Math.round(SIZE * 0.045));
      g.append('text').attr('text-anchor','middle').attr('y', -countFontSize * 0.35)
        .style('fill', 'var(--accent-color, #22c55e)')
        .attr('font-size', countFontSize).attr('font-weight', 900).text(pts.length);
      g.append('text').attr('text-anchor','middle').attr('y', countFontSize * 0.55)
        .style('fill', 'var(--fg-muted-4, #8fa8b8)')
        .attr('font-size', Math.max(9, Math.round(SIZE * 0.02))).text('pickups');
    }

    render();

    // Re-render whenever the container is resized
    const ro = new ResizeObserver(() => render());
    ro.observe(box);
  }

  window.tgtgDataPromise.then(init).catch(err => console.error('Radial viz error:', err));
  (window.tgtgRerenderFns = window.tgtgRerenderFns || []).push(init);
})();
</script>
{% endraw %}
