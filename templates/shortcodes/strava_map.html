<script>
(function () {
  function injectLink(href, id) {
    if (document.getElementById(id)) return;
    var link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = href; link.id = id;
    document.head.appendChild(link);
  }
  injectLink('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', 'strava-leaflet-css');
})();
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

<div id="strava-map" style="height:400px;width:100%;border-radius:8px;margin:1rem 0;"></div>

<script>
(function () {
  function init() {
    var map = L.map('strava-map', { zoomControl: true });
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var tileUrl = dark
      ? 'http://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'
      : 'http://{s}.tile.osm.org/{z}/{x}/{y}.png';
    L.tileLayer(tileUrl, {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    fetch('./route.geojson')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var routeLayer = L.geoJSON(data, {
          style: { color: '#22c55e', weight: 3, opacity: 0.9 }
        }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
