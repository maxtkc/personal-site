{% include "partials/leaflet_deps.html" %}

<style>#strava-map .leaflet-tile { border-radius: 0 !important; }</style>
<div id="strava-map" style="height:400px;width:100%;border-radius:8px;margin:1rem 0;"></div>

<script>
(function () {
  function init() {
    var map = L.map('strava-map', { zoomControl: true });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: '&copy; Esri',
      maxZoom: 19
    }).addTo(map);

    fetch('./route.geojson')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        L.geoJSON(data, { style: { color: '#14532d', weight: 6, opacity: 1 } }).addTo(map);
        var routeLayer = L.geoJSON(data, { style: { color: '#22c55e', weight: 3, opacity: 1 } }).addTo(map);
        map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
