{% include "partials/maplibre_deps.html" %}

{%- set sport = "" -%}
{%- if page.taxonomies.tags -%}{%- set sport = page.taxonomies.tags | first -%}{%- endif %}
<div class="strava-map-box loading" style="height:420px;">
  <div id="strava-map" class="strava-map-gl" data-sport="{{ sport }}"></div>
</div>

{% raw %}
<script>
(function () {
  function init() {
    const el = document.getElementById('strava-map');
    const cat = StravaMap.categoryOf(el.dataset.sport || '');

    fetch('./route.geojson')
      .then(r => r.json())
      .then(data => {
        data.features.forEach(f => { f.properties = Object.assign({}, f.properties, { cat }); });
        const line = data.features[0] && data.features[0].geometry.coordinates;
        const ends = {
          type: 'FeatureCollection',
          features: line && line.length > 1 ? [
            { type: 'Feature', properties: { end: 0 }, geometry: { type: 'Point', coordinates: line[0] } },
            { type: 'Feature', properties: { end: 1 }, geometry: { type: 'Point', coordinates: line[line.length - 1] } },
          ] : [],
        };

        const map = StravaMap.createMap(el, {
          bounds: StravaMap.boundsOf(data),
          fitBoundsOptions: { padding: 30 },
        }, theme => {
          el.parentElement.classList.remove('loading');
          map.addSource('route', { type: 'geojson', data });
          map.addSource('ends', { type: 'geojson', data: ends });
          map.addLayer({
            id: 'route-casing', type: 'line', source: 'route',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': StravaMap.casingColor(theme), 'line-width': 7 },
          });
          map.addLayer({
            id: 'route', type: 'line', source: 'route',
            layout: { 'line-cap': 'round', 'line-join': 'round' },
            paint: { 'line-color': StravaMap.colorExpr(theme), 'line-width': 3.5 },
          });
          map.addLayer({
            id: 'ends', type: 'circle', source: 'ends',
            paint: {
              'circle-radius': 5,
              'circle-color': ['match', ['get', 'end'], 0, '#22c55e', '#ef4444'],
              'circle-stroke-width': 2,
              'circle-stroke-color': StravaMap.casingColor(theme),
            },
          });
        });
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
{% endraw %}
