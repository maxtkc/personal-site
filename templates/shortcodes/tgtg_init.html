<script>
// Inject tgtg-viz stylesheet into <head> to avoid body placement issues.
(function () {
  if (document.getElementById('tgtg-viz-css')) return;
  var link = document.createElement('link');
  link.rel = 'stylesheet'; link.href = '/tgtg-viz.css'; link.id = 'tgtg-viz-css';
  document.head.appendChild(link);
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
