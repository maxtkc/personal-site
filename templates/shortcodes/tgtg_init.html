<div id="tooltip"></div>

<script>
// Inject stylesheets into <head> to avoid body placement issues and prevent double-loading
(function () {
  function injectLink(href, id) {
    if (document.getElementById(id)) return;
    var link = document.createElement('link');
    link.rel = 'stylesheet'; link.href = href; link.id = id;
    document.head.appendChild(link);
  }
  injectLink('https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', 'tgtg-leaflet-css');
  injectLink('/tgtg-viz.css', 'tgtg-viz-css');
})();
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="/tgtg-viz-init.js"></script>
